name: Android release candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Capture preview screenshots
        run: node --test --test-name-pattern='capture real gameplay images' tests/ui.test.mjs
        continue-on-error: true
        env:
          ARTIFACT_DIR: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-gameplay-screenshots
          path: artifacts/screenshots
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: gradle --no-daemon --continue :app:assembleDebug :app:bundleRelease :app:lintDebug
      - name: Print lint findings
        if: always()
        run: find app/build -name 'lint-results-debug.txt' -type f -exec head -n 160 {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-candidate
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
